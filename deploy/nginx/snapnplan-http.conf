# SnapNPlan before its HTTPS certificate exists. setup-server.sh swaps in
# snapnplan-https.conf as soon as the certificate has been issued.
server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 100m;          # up to 10 phone photos per quiz

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        alias /srv/snapnplan/data/staticfiles/;
        add_header Cache-Control "no-cache";
    }
    location /media/ {
        alias /srv/snapnplan/data/media/;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
