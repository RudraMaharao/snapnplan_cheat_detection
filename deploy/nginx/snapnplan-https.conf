# SnapNPlan over HTTPS. Screen sharing in the online exam needs HTTPS.
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100m;          # up to 10 phone photos per quiz

    # Static files are not renamed on each release, so browsers check for a
    # newer copy every time instead of keeping an old exam script.
    location /static/ {
        alias /srv/snapnplan/data/staticfiles/;
        add_header Cache-Control "no-cache";
    }
    location /media/ {
        alias /srv/snapnplan/data/media/;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
